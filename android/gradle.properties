org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false

# ── ABI 裁剪（sherpa_onnx 需要）──
# sherpa_onnx 的 Android 依赖带 4 个 ABI 的预编译 .so：
#   arm64-v8a 26MB / armeabi-v7a 19MB / x86 31MB / x86_64 30MB（合计 107MB）
# 真机 HUAWEI ADA-AL00 是 arm64，只保留它 → APK 增量从 ~75MB 降到 ~26MB。
#
# ★ 为什么必须加这个开关：Flutter Gradle 插件在 apply() 里会执行
#   `defaultConfig.ndk { abiFilters.clear(); abiFilters.addAll(PLATFORM_ABI_LIST) }`
#   （见 FlutterPlugin.configureAbiWithoutSplits），默认列表是
#   [armeabi-v7a, arm64-v8a, x86_64] 三个。这个开关（FlutterPluginUtils 的
#   PROP_DISABLE_ABI_FILTERING）让插件**完全不碰** abiFilters，
#   于是 app/build.gradle.kts 里的设置必定生效，且不依赖插件与脚本的执行顺序。
disable-abi-filtering=true
